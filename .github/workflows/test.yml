name: screenshot
on: workflow_dispatch
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node scripts/capture.js
      - run: |
          git config user.name "capture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/screenshots/glowlab && git commit -m "chore: capture GlowLab screenshots" || echo "nothing"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: glowlab-shots
          path: public/screenshots/glowlab
