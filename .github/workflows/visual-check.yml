name: visual-check
on:
  push:
    paths: ['visual-check.txt']
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm i playwright@1.48.2 --no-save && npx playwright install --with-deps chromium
      - run: mkdir -p .visual/out && node .visual/shots.cjs > .visual/out/log.txt 2>&1 || true
      - run: |
          git config user.name "visual-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f .visual/out
          git commit -m "chore: visual output" || echo nothing
          git push
