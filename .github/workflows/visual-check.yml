name: visual-check
on:
  push:
    paths: ['visual-check.txt']
  workflow_dispatch:
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm i playwright@1.48.2 --no-save && npx playwright install --with-deps chromium
      - run: node .visual/shots.js
      - uses: actions/upload-artifact@v4
        with:
          name: visual
          path: .visual/out
